<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 136" fill="none">
  <defs>
    <!-- Light Mode Gradient -->
    <linearGradient id="arc-mark-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#b88a94" />
      <stop offset="50%" stop-color="#93646f" />
      <stop offset="100%" stop-color="#69414d" />
    </linearGradient>

    <!-- Dark Mode Gradient -->
    <linearGradient id="arc-mark-grad-dark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3" />
      <stop offset="50%" stop-color="#f5d0c5" />
      <stop offset="100%" stop-color="#e2a8b6" />
    </linearGradient>

    <!-- Warm Glowing Lamp Beam -->
    <linearGradient id="lamp-beam" x1="88" y1="38" x2="50" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fcd34d" stop-opacity="0.0" />
    </linearGradient>

    <filter id="lamp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .arc-stroke {
        fill: url(#arc-mark-grad);
        transition: fill 0.3s ease;
      }
      @media (prefers-color-scheme: dark) {
        .arc-stroke {
          fill: url(#arc-mark-grad-dark);
        }
      }
      :root[data-theme='dark'] .arc-stroke {
        fill: url(#arc-mark-grad-dark);
      }
    </style>
  </defs>

  <!-- Ambient Light Cone -->
  <polygon points="88,38 18,132 102,132" fill="url(#lamp-beam)" opacity="0.35" />

